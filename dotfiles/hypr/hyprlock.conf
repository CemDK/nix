# Used by lock-screen and login-lock (modules/features/lock-screen).

general {
  hide_cursor = true
  ignore_empty_input = true
}

animations {
  enabled = false
}

auth {
  fingerprint:enabled = true
  fingerprint:ready_message = <span font_family="MesloLGS Nerd Font">󰈷</span>  Fingerprint or password
  fingerprint:present_message = Scanning...
}

background {
  monitor =
  path = /etc/lock-screen/background.png
  color = rgb(062027)
}

label {
  monitor =
  text = cmd[update:60000] LC_TIME=C date +"%a %b %-d"
  font_family = DejaVu Sans Bold
  font_size = 18
  color = rgba(ffffffb3)
  position = 0, 330
  halign = center
  valign = center
}

label {
  monitor =
  text = $TIME
  font_family = DejaVu Sans Bold
  font_size = 72
  color = rgba(ffffffb3)
  position = 0, 260
  halign = center
  valign = center
}

label {
  monitor =
  text = <b>$USER</b>
  font_family = DejaVu Sans
  font_size = 16
  color = rgb(ffffff)
  position = 0, -380
  halign = center
  valign = center
}

input-field {
  monitor =
  size = 240, 36
  outline_thickness = 0
  rounding = -1
  inner_color = rgba(06202766)
  font_color = rgb(ffffff)
  check_color = rgb(005f60)
  fail_color = rgb(f78104)
  capslock_color = rgb(f78104)
  placeholder_text = <span foreground="##93a1a1">Password</span>
  fail_text = $FAIL
  dots_center = true
  fade_on_empty = false
  position = 0, -428
  halign = center
  valign = center
}

label {
  monitor =
  text = <b>$FPRINTPROMPT</b>
  font_family = DejaVu Sans
  font_size = 11
  color = rgb(ffffff)
  position = 0, -472
  halign = center
  valign = center
}
