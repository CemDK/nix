# Validate with: mango -p
source=~/.config/mango/envs.conf
source=~/.config/mango/input.conf
source=~/.config/mango/keybindings.conf
source=~/.config/mango/looknfeel.conf
source=~/.config/mango/monitors.conf
source=~/.config/mango/workspaces.conf

#################
### AUTOSTART ###
#################
exec-once=waybar -c ~/.config/waybar/config-mango.jsonc
exec-once=swaybg -m fill -i ~/.config/nix/dotfiles/wallpapers/oat/autumn-season-leafs-plant-scene-generative-ai.jpg
exec-once=swayosd-server
exec-once=systemctl --user start elephant.service && systemctl --user start walker.service
exec-once=firefox
exec-once=alacritty
