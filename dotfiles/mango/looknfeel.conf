####################
### LOOK & FEEL ###
####################
# Gaps (inner / outer)
gappih=10
gappiv=10
gappoh=20
gappov=20

borderpx=1
# Colors are premultiplied RGBA: scale R, G, B by the alpha, or translucent
# colors render too bright. Same colors as hyprland's rgba(ffa94060) / rgba(003c3daa).
focuscolor=0x603f1860  # Light orange from alacritty oat theme
bordercolor=0x002828aa # Darker teal from alacritty oat theme
rootcolor=0x1a1a1aff

border_radius=16
focused_opacity=1.0
unfocused_opacity=0.9

dim_enable=1
dim_unfocused_color=0x0000006b # 0.42 strength, like hyprland dim_strength

shadows=1
layer_shadows=0
shadow_only_floating=0
shadows_size=4
shadows_blur=6
shadowscolor=0x181818ee # premultiplied 0x1a1a1aee

# blur_optimized only blurs the wallpaper (like hyprland xray=true)
blur=1
blur_layer=1
blur_optimized=1
blur_params_radius=6
blur_params_num_passes=3
blur_params_noise=0.01
blur_params_brightness=1.0
blur_params_contrast=1.0
blur_params_saturation=1.27

animations=0 # off: even at duration 0, tag switches shifted windows for a frame
layer_animations=1
animation_type_open=zoom
animation_type_close=zoom
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.87
animation_duration_open=410
animation_duration_close=150
animation_duration_move=480
animation_duration_tag=200
animation_curve_open=0.23,1,0.32,1
animation_curve_move=0.23,1,0.32,1
animation_curve_tag=0.5,0.5,0.75,1.0
animation_curve_close=0,0,1,1

# Layout
dwindle_preserve_split=1

# Misc
focus_on_activate=1
warpcursor=0
