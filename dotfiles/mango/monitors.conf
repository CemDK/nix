# List monitors: wlr-randr  /  mmsg get all-monitors
# Same modes as dotfiles/hypr/monitors.conf

# Laptop panel
monitorrule=name:^eDP-1$,width:1920,height:1080,refresh:60,x:0,y:0,scale:1

# My 27" 1440p 165Hz monitor, right of the laptop
monitorrule=name:^HDMI-A-1$,width:2560,height:1440,refresh:144,x:1920,y:0,scale:1
