###################
### MY PROGRAMS ###
###################

# mainMod = ALT

bind=ALT,space,spawn,walker
bind=ALT,e,spawn,dolphin
bind=SUPER,space,spawn_shell,~/.config/nix/scripts/system-menu.sh
bind=ALT+SHIFT,r,spawn_shell,pkill waybar; waybar -c ~/.config/waybar/config-mango.jsonc
bind=SUPER,r,reload_config

# Screenshot region to clipboard (matches Win+Shift+S)
bind=SUPER+SHIFT,s,spawn_shell,grim -g "$(slurp -d)" - | wl-copy

#########################
### WINDOW MANAGEMENT ###
#########################
bind=ALT,q,killclient
bind=ALT+SHIFT,e,quit
bind=ALT+SHIFT,space,togglefloating
# centered floating
bindc=ALT,c,togglefloating
bindc=ALT,c,centerwin
bind=ALT,v,dwindle_toggle_current_split
bind=ALT,m,minimized
bind=ALT+SHIFT,m,restore_minimized
bind=ALT,Tab,focusstack,next
bind=ALT+SHIFT,f,togglefullscreen
bind=SUPER,Tab,toggleoverview

# Move focus with ALT + arrow keys or CTRL+ALT+hjkl
bind=ALT,Left,focusdir,left
bind=ALT,Right,focusdir,right
bind=ALT,Up,focusdir,up
bind=ALT,Down,focusdir,down
bind=CTRL+ALT,h,focusdir,left
bind=CTRL+ALT,l,focusdir,right
bind=CTRL+ALT,k,focusdir,up
bind=CTRL+ALT,j,focusdir,down

# Move windows with ALT+SHIFT+hjkl or ALT+SHIFT+arrows
bind=ALT+SHIFT,h,move_client,left
bind=ALT+SHIFT,l,move_client,right
bind=ALT+SHIFT,k,move_client,up
bind=ALT+SHIFT,j,move_client,down
bind=ALT+SHIFT,Left,move_client,left
bind=ALT+SHIFT,Right,move_client,right
bind=ALT+SHIFT,Up,move_client,up
bind=ALT+SHIFT,Down,move_client,down

# Resize windows
bind=ALT,u,resizewin,-40,+0
bind=ALT,o,resizewin,+0,+40

# Resize mode (ALT+R to enter, hjkl/arrows to resize, enter/escape to exit)
bind=ALT,r,setkeymode,resize

keymode=resize
bind=NONE,h,resizewin,-40,+0
bind=NONE,l,resizewin,+40,+0
bind=NONE,k,resizewin,+0,-40
bind=NONE,j,resizewin,+0,+40
bind=NONE,Left,resizewin,-40,+0
bind=NONE,Right,resizewin,+40,+0
bind=NONE,Up,resizewin,+0,-40
bind=NONE,Down,resizewin,+0,+40
bind=NONE,Escape,setkeymode,default
bind=NONE,Return,setkeymode,default

keymode=default

#################
### TAGS ###
#################
# mango has 9 tags per monitor; hyprland's workspace 10 (ALT+0, ALT+H) maps to 9
bind=ALT,1,view,1,0
bind=ALT,2,view,2,0
bind=ALT,3,view,3,0
bind=ALT,4,view,4,0
bind=ALT,5,view,5,0
bind=ALT,6,view,6,0
bind=ALT,7,view,7,0
bind=ALT,8,view,8,0
bind=ALT,9,view,9,0
bind=ALT,0,view,9,0

# Alternative tag bindings (matching GlazeWM)
bind=ALT,h,view,9,0
bind=ALT,f,view,1,0
bind=ALT,j,view,2,0
bind=ALT,k,view,3,0
bind=ALT,l,view,4,0
bind=ALT,semicolon,view,5,0

# Navigate tags
bind=ALT,s,viewtoright_have_client,0
bind=ALT,n,viewtoright_have_client,0
bind=ALT,a,viewtoleft_have_client,0
bind=ALT,p,viewtoleft_have_client,0
bind=ALT,d,view,-1,0

# Move active window to a tag with ALT + SHIFT + [0-9]
bind=ALT+SHIFT,1,tag,1,0
bind=ALT+SHIFT,2,tag,2,0
bind=ALT+SHIFT,3,tag,3,0
bind=ALT+SHIFT,4,tag,4,0
bind=ALT+SHIFT,5,tag,5,0
bind=ALT+SHIFT,6,tag,6,0
bind=ALT+SHIFT,7,tag,7,0
bind=ALT+SHIFT,8,tag,8,0
bind=ALT+SHIFT,9,tag,9,0
bind=ALT+SHIFT,0,tag,9,0

# Special workspace (scratchpad)
bind=ALT,minus,toggle_special_tag
bind=ALT+SHIFT,minus,tag_special_tag

#############
### MOUSE ###
#############
# Scroll through tags with ALT + scroll
axisbind=ALT,UP,viewtoleft_have_client,0
axisbind=ALT,DOWN,viewtoright_have_client,0

# Move/resize windows with ALT + LMB/RMB and dragging
mousebind=ALT,btn_left,moveresize,curmove
mousebind=ALT,btn_right,moveresize,curresize

# 4-finger horizontal swipe switches tags
gesturebind=none,left,4,viewtoright_have_client,0
gesturebind=none,right,4,viewtoleft_have_client,0

###################
### MEDIA KEYS ###
###################
bindl=NONE,XF86AudioRaiseVolume,spawn,swayosd-client --output-volume raise
bindl=NONE,XF86AudioLowerVolume,spawn,swayosd-client --output-volume lower
bindl=NONE,XF86AudioMute,spawn,swayosd-client --output-volume mute-toggle
bindl=NONE,XF86AudioMicMute,spawn,mic-toggle
bindl=NONE,XF86MonBrightnessUp,spawn,swayosd-client --brightness raise
bindl=NONE,XF86MonBrightnessDown,spawn,swayosd-client --brightness lower

# Requires playerctl
bindl=NONE,XF86AudioNext,spawn,playerctl next
bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause
bindl=NONE,XF86AudioPrev,spawn,playerctl previous
