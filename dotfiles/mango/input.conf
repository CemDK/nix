#############
### INPUT ###
#############
# Custom US layout with z/y swapped and umlauts on AltGr (~/.config/xkb/symbols/uscustom)
xkb_rules_layout=uscustom

repeat_rate=40
repeat_delay=600

sloppyfocus=1

# Trackpad (needs relogin to apply)
trackpad_natural_scrolling=1
trackpad_click_method=2 # clickfinger: two-finger click = right-click
trackpad_scroll_factor=0.4
tap_to_click=1
tap_and_drag=1
drag_lock=0
trackpad_disable_while_typing=1
