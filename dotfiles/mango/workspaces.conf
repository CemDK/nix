# ==============================================================================
# TAG RULES
# ==============================================================================
# 1 browser, 2 terminal, 3 editor, 4 explorer, 7 notes, 8 misc/unity,
# 9 games & launchers (also hyprland's workspace 10 / Edge)
tag_num=9 # mango has 9 tags per monitor
# 1 and 2 persistent like waybar's persistent-workspaces; 1 and 8 borderless
tagrule=id:1,layout_name:dwindle,no_hide:1,no_render_border:1
tagrule=id:2,layout_name:dwindle,no_hide:1
tagrule=id:3,layout_name:dwindle
tagrule=id:4,layout_name:dwindle
tagrule=id:5,layout_name:dwindle
tagrule=id:6,layout_name:dwindle
tagrule=id:7,layout_name:dwindle
tagrule=id:8,layout_name:dwindle,no_render_border:1
tagrule=id:9,layout_name:dwindle

# ---------------------------------------------------------------------------
# WORKSPACE 1 - Browser
# ---------------------------------------------------------------------------
windowrule=tags:1,appid:^(zen|app\.zen_browser\.zen|firefox|Firefox)$
windowrule=tags:1,title:^(Mozilla Firefox)$

# ---------------------------------------------------------------------------
# WORKSPACE 2 - Terminal
# ---------------------------------------------------------------------------
windowrule=tags:2,appid:^([Tt]erminal|Alacritty|kitty|foot)$

# ---------------------------------------------------------------------------
# WORKSPACE 3 - Editor
# ---------------------------------------------------------------------------
windowrule=tags:3,appid:^(code|Code|VSCodium|neovide)$
windowrule=tags:3,title:^(Visual Studio Code)$
windowrule=tags:3,title:^(Microsoft Visual Studio 2022)$

# ---------------------------------------------------------------------------
# WORKSPACE 4 - File Manager
# ---------------------------------------------------------------------------
windowrule=tags:4,appid:^(thunar|pcmanfm|nautilus|dolphin|org.kde.dolphin|nemo)$

# ---------------------------------------------------------------------------
# WORKSPACE 5 - Games
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# WORKSPACE 6 - Others
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# WORKSPACE 7 - Anki & Obsidian
# ---------------------------------------------------------------------------
windowrule=tags:7,appid:^(anki|obsidian)$

# ---------------------------------------------------------------------------
# WORKSPACE 8 - Misc
# ---------------------------------------------------------------------------
windowrule=tags:8,appid:^(vlc|mpv|org.gnome.Nautilus.+|SumatraPDF)$
windowrule=tags:8,title:^(Plex)$
windowrule=tags:8,title:^(org.freecad.FreeCAD)$
windowrule=tags:8,title:^([Vv]irtual[Bb]ox)$

# Unity editor tweaks
windowrule=tags:8,isnoradius:1,appid:^(Unity)$

# ---------------------------------------------------------------------------
# WORKSPACE 9 - Games and Launchers (+ Edge, hyprland's workspace 10)
# ---------------------------------------------------------------------------
windowrule=tags:9,appid:^(microsoft-edge|msedge|Edge)$
windowrule=tags:9,appid:^(unityhub)$
windowrule=tags:9,appid:^([Ss]team|[Ee]pic[Gg]ames[Ll]auncher|[Dd]iscord)$
windowrule=tags:9,isfullscreen:1,appid:^([Mm]inecraft.*)$
windowrule=tags:9,title:^(GOG Galaxy)$

# ==============================================================================
# FLOATING RULES
# ==============================================================================
windowrule=isfloating:1,title:^(Calculator|calc|Rechner)$
windowrule=isfloating:1,title:^(Task Manager|Task-Manager)$
windowrule=isfloating:1,appid:^(Bitwarden)$
windowrule=isfloating:1,title:^(Extension.*Bitwarden.*)$
windowrule=isfloating:1,title:^([Mm]inecraft [Ll]auncher)$
windowrule=isfloating:1,title:^([Vv]irtual[Bb]ox Manager)$

# ==============================================================================
# LAYER RULES
# ==============================================================================
# Only walker gets blur (hyprland: layerrule blur on for walker)
layerrule=noblur:1,layer_name:^(waybar|swayosd)$
# No blur or animation on the slurp selection, so it doesn't end up in screenshots
layerrule=noanim:1,noblur:1,layer_name:selection

# About This Computer (waybar system menu)
windowrule=isfloating:1,width:900,height:560,appid:^(about-this-computer)$
