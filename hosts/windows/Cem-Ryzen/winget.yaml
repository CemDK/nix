# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2
#
# Declarative package set for the Windows side of Cem-Ryzen.
# Apply from WSL with `make windows` (runs `winget configure` via interop).
#
# NOTE: winget configure is additive-only — it installs what is listed here
# but never removes anything. Uninstalls stay manual (`winget uninstall <id>`).
# Find IDs with `winget search <name>`; snapshot reality with `winget export`.
properties:
  configurationVersion: 0.2.0
  resources:
    # ------------------------------------------------------------------
    # WSL — bootstrap for the Nix side of this repo
    # ------------------------------------------------------------------
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: wsl
      settings:
        id: Microsoft.WSL
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: ubuntu
      settings:
        id: Canonical.Ubuntu
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: debian
      settings:
        id: Debian.Debian
        source: winget

    # ------------------------------------------------------------------
    # Dev tooling
    # ------------------------------------------------------------------
